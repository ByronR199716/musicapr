name: Compilar APK (Musica Pr)

# Se ejecuta al subir cambios a la rama principal, o a mano desde la pestaña "Actions".
on:
  workflow_dispatch:
  push:
    branches: [ 'dev', 'main' ]
    paths-ignore:
      - '**.md'
      - 'acceso/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'recursive'

      - name: Instalar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: "microsoft"
          cache: 'gradle'

      - name: Revisar secretos de firma
        env:
          BASE_64_SIGNING_KEY: ${{ secrets.BASE_64_SIGNING_KEY }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in BASE_64_SIGNING_KEY KEY_STORE_PASSWORD ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Falta el secreto $v (Settings > Secrets and variables > Actions)"; exit 1; fi
          done
          echo "$BASE_64_SIGNING_KEY" | base64 -d > simpmusic.jks

      - name: Usar versión FOSS (sin Sentry ni Last.fm)
        run: |
          echo "" >> ./gradle.properties
          echo "isFullBuild=false" >> ./gradle.properties

      - name: Compilar y firmar APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew exportLibraryDefinitions
          ./build_and_sign_apk.sh --release --foss
          mkdir -p salida
          for f in androidApp/build/outputs/apk/release/SimpMusic-foss-*.apk; do
            cp "$f" "salida/MusicaPr-$(basename "$f" | sed 's/^SimpMusic-foss-//')"
          done
          ls -la salida

      - name: Guardar APK en esta ejecución
        uses: actions/upload-artifact@v4
        with:
          name: MusicaPr-apk
          path: salida/*.apk

      - name: Publicar en Releases (link de descarga directo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Musica Pr build ${{ github.run_number }}
          body: "APK compilado automáticamente. Para la mayoría de teléfonos usa el archivo que termina en universal-release.apk."
          files: salida/*.apk
